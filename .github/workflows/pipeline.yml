name: Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
      - 'LICENSE'

# Cancel any in-progress run for the same branch/PR so pushes don't queue up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 0. CI — always runs on every push / PR ────────────────────────────────
  ci:
    name: CI (lint · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pipenv flake8
          pipenv install --dev

      - name: Lint Python (flake8)
        run: flake8 .

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: "error"

      - name: Run tests
        run: pipenv run pytest

      - name: OpenSSF Scorecard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

  # ── 2. Terraform plan — always runs (drift check + real plan) ───────────────
  terraform-plan:
    name: Terraform plan
    needs: [ci]
    outputs:
      has_changes: ${{ steps.plan_check.outputs.has_changes }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # needed to post PR comment
    env:
      TF_VAR_DB_PASSWORD:            ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_cloudflare_api_token:   ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id:     ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id:  ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_secret_key:             ${{ secrets.TF_VAR_SECRET_KEY }}
      TF_VAR_SUPERUSER_NAME:         ${{ secrets.TF_VAR_SUPERUSER_NAME }}
      TF_VAR_SUPERUSER_EMAIL:        ${{ secrets.TF_VAR_SUPERUSER_EMAIL }}
      TF_VAR_SUPERUSER_PASSWORD:     ${{ secrets.TF_VAR_SUPERUSER_PASSWORD }}
      TF_VAR_environment:            production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: terraform plan -out=tfplan -no-color -input=false -detailed-exitcode 2>&1 | tee /tmp/tfplan.txt
        continue-on-error: true   # exit 2 (changes exist) would fail the step without this

      - name: Evaluate plan result
        id: plan_check
        run: |
          EXIT="${{ steps.plan.outputs.exitcode }}"
          echo "Terraform plan exit code: $EXIT"
          if [ "$EXIT" = "1" ]; then echo "Plan errored"; exit 1; fi
          echo "has_changes=$([ "$EXIT" = "2" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Upload plan artifact
        if: steps.plan_check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 1  # plan is only valid until the next run

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('/tmp/tfplan.txt', 'utf8');
            // Truncate if over GitHub's 65 000-char comment limit
            if (plan.length > 60000) {
              plan = plan.slice(0, 60000) + '\n\n... (truncated) ...';
            }
            const outcome = '${{ steps.plan_check.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const body = `### ${icon} Terraform Plan — \`${{ github.head_ref }}\`
            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} · ${{ github.event_name }}*`;

            // Delete previous plan comments to keep the PR clean
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.login === 'github-actions[bot]' && c.body.includes('Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

  # ── 3. Terraform apply — push to main only, when plan has actual changes ──────
  terraform-apply:
    name: Terraform apply
    needs: [terraform-plan]
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform-plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TF_VAR_DB_PASSWORD:            ${{ secrets.TF_VAR_DB_PASSWORD }}
      TF_VAR_cloudflare_api_token:   ${{ secrets.TF_VAR_CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id:     ${{ secrets.TF_VAR_CLOUDFLARE_ZONE_ID }}
      TF_VAR_cloudflare_account_id:  ${{ secrets.TF_VAR_CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_secret_key:             ${{ secrets.TF_VAR_SECRET_KEY }}
      TF_VAR_SUPERUSER_NAME:         ${{ secrets.TF_VAR_SUPERUSER_NAME }}
      TF_VAR_SUPERUSER_EMAIL:        ${{ secrets.TF_VAR_SUPERUSER_EMAIL }}
      TF_VAR_SUPERUSER_PASSWORD:     ${{ secrets.TF_VAR_SUPERUSER_PASSWORD }}
      TF_VAR_environment:            production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false tfplan

  # ── 4. Deploy — push to main only, after CI + terraform (if it ran) ────────
  deploy:
    name: Deploy to ECS
    needs: [ci,terraform-apply]
    # always() lets this job evaluate even when terraform-apply was skipped
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION:      eu-north-1
      ECR_REPOSITORY:  ecommerce-app-production
      ECS_SERVICE:     ecommerce-app-production-service
      ECS_CLUSTER:     ecommerce-app-production-cluster
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG:    ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster  $ECS_CLUSTER \
            --service  $ECS_SERVICE \
            --force-new-deployment \
            --region   $AWS_REGION
