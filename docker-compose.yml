services:
  web:
    build: .
    container_name: django-app
    command: ./docker-entrypoint.sh
    ports:
      - 8000:8000
    depends_on:
      # - redis
      - mysql
    restart: on-failure
    env_file:
      - .env
    environment:
      - SECRET_KEY=ILOVELOLO
      - DJANGO_SETTINGS_MODULE=storefront.settings.prod
    volumes:
      - ./static:/app/static
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - 3306:3306
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_DATABASE=storefront3
      - MYSQL_ROOT_PASSWORD=Az051277
    volumes:
      - mysqldata:/var/lib/mysql
