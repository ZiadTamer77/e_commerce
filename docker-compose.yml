services:
  web:
    build: .
    container_name: django-app
    command: ./docker-entrypoint.sh
    ports:
      - "8000:8000"
    depends_on:
      - mysql
    restart: always
    env_file:
      - .env
    volumes:
      - ./static:/app/static
      - ./media:/app/media

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3306:3306"
    restart: always
    env_file:
      - .env
    volumes:
      - mysqldata:/var/lib/mysql

volumes:
  mysqldata: